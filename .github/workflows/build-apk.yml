name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ekstrak file ZIP proyek otomatis
        id: prep
        run: |
          if [ -f "package.json" ]; then
            echo "workdir=." >> "$GITHUB_OUTPUT"
          else
            ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Tidak ditemukan package.json maupun file .zip proyek!"
              exit 1
            fi
            echo "Mengekstrak: $ZIP_FILE"
            mkdir -p _extracted
            unzip -q -o "$ZIP_FILE" -d _extracted
            PKG_PATH=$(find _extracted -maxdepth 3 -name "package.json" | head -n 1)
            if [ -z "$PKG_PATH" ]; then
              echo "ERROR: package.json tidak ditemukan di dalam $ZIP_FILE"
              exit 1
            fi
            WORK_DIR=$(dirname "$PKG_PATH")
            echo "Direktori kerja: $WORK_DIR"
            echo "workdir=$WORK_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        working-directory: ${{ steps.prep.outputs.workdir }}
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android project
        working-directory: ${{ steps.prep.outputs.workdir }}
        run: |
          if [ ! -f capacitor.config.json ]; then
            printf '{"appId":"com.falakiyah.studio","appName":"Falakiyah Studio","webDir":"dist","bundledWebRuntime":false}\n' > capacitor.config.json
          fi
          npm install --no-save @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          npx cap add android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("ACCESS_FINE_LOCATION")) {
              xml = xml.replace(
                "<uses-permission android:name=\"android.permission.INTERNET\" />",
                "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"
              );
              fs.writeFileSync(p, xml);
            }
          '
          npx cap sync android

      - name: Build Debug APK
        working-directory: ${{ steps.prep.outputs.workdir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: falakiyah-studio-debug-apk
          path: ${{ steps.prep.outputs.workdir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
